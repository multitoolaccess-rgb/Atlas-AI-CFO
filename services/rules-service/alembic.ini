# services/rules-service/alembic.ini
#
# Phase 3 lift from wealthiq ``backend/alembic.ini`` (verbatim). The file is
# the CLI entry point; ``alembic/env.py`` (Phase 2 pre-stage, Phase 3 wiring)
# reads ``sqlalchemy.url`` from ``app.config.settings`` so this file does NOT
# carry a connection string.

[alembic]
script_location = alembic

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stdout,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
